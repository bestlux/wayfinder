name: Report a problem
description: Something in Wayfinder did the wrong thing, or nothing at all.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Fill in what you can — a rough report beats no report.

        **This issue will be public.** Before you post, check your text and screenshots for player names, your world's URL or invite link, and anything else you'd rather not share.

        Not sure Wayfinder supports your build yet? The [coverage matrices](https://github.com/bestlux/wayfinder/tree/master/docs/coverage) list what's guided today — a step Wayfinder hands back to the PF2E sheet may simply not be covered yet.
  - type: input
    id: wayfinder-version
    attributes:
      label: Wayfinder version
      description: Filled in for you if you came here from Wayfinder's Feedback button. Otherwise it's on Foundry's Manage Modules screen.
      placeholder: "0.7.1"
    validations:
      required: true
  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      description: Filled in for you if you came here from Wayfinder's Feedback button.
      placeholder: "14.364"
    validations:
      required: true
  - type: input
    id: pf2e-version
    attributes:
      label: PF2E system version
      description: Filled in for you if you came here from Wayfinder's Feedback button.
      placeholder: "8.4.0"
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: What were you building?
      description: Level, class, ancestry, and any archetype or variant rules your table uses.
      placeholder: Level 3 Rogue, Human, Free Archetype off
  - type: textarea
    id: steps
    attributes:
      label: What were you doing?
      description: Walk me through what you clicked, so I can land on the same screen you did.
      placeholder: |
        1. Open Wayfinder on a blank character.
        2. Set the target level to 3.
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened, and what did you expect instead?
      description: Both halves help — the second one is often where the real bug is hiding.
      placeholder: |
        Wayfinder offered me Dual-Weapon Warrior feats, but I don't have that dedication.
        I expected the list to only show feats I'm actually eligible for.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console errors
      description: Optional, and always welcome. F12 opens your browser's console if there's a red error in there. Same privacy check applies.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I checked my text and screenshots for player names, world links, and invite codes.
          required: true
